name: Deploy luckypod.transkoi.com

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1

    - name: Print deploy info (secrets masked)
      run: |
        echo "::notice::Deploying to: ${{ secrets.ALIYUN_HOST }} (user: ${{ secrets.ALIYUN_USER }})"
        echo "::notice::Target path: /www/wwwroot/luckypod.transkoi.com"

    - name: Deploy to domestic server (luckypod.transkoi.com)
      uses: easingthemes/ssh-deploy@v4
      with:
        SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.ALIYUN_HOST }}
        REMOTE_USER: ${{ secrets.ALIYUN_USER }}
        REMOTE_PORT: ${{ secrets.ALIYUN_PORT }}
        SOURCE: "dist/"
        TARGET: "/www/wwwroot/luckypod.transkoi.com"
        ARGS: "-avzr --delete"
        SCRIPT_AFTER: |
          echo "=== Verify files on server ==="
          echo "Current user: $(whoami)"
          echo "Target directory listing:"
          ls -la /www/wwwroot/luckypod.transkoi.com/
          echo "File count:"
          find /www/wwwroot/luckypod.transkoi.com/ -type f | wc -l
          echo "HTML files:"
          find /www/wwwroot/luckypod.transkoi.com/ -name "*.html"
          echo "=== Done ==="
