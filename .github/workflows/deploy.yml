name: Deploy luckypod.transkoi.com

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1

    - name: Deploy to domestic server (luckypod.transkoi.com)
      uses: easingthemes/ssh-deploy@v4
      with:
        SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.ALIYUN_HOST }}
        REMOTE_USER: ${{ secrets.ALIYUN_USER }}
        REMOTE_PORT: ${{ secrets.ALIYUN_PORT }}
        SOURCE: "dist/"
        TARGET: "/www/wwwroot/luckypod.transkoi.com"
        ARGS: "-avzr --delete"

    - name: Verify deployment
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: ${{ secrets.ALIYUN_USER }}
        key: ${{ secrets.ALIYUN_SSH_KEY }}
        port: ${{ secrets.ALIYUN_PORT }}
        script: |
          echo "=== Files in /www/wwwroot/luckypod.transkoi.com ==="
          ls -la /www/wwwroot/luckypod.transkoi.com/
          echo "=== File count ==="
          find /www/wwwroot/luckypod.transkoi.com/ -type f | wc -l
          echo "=== HTML files ==="
          find /www/wwwroot/luckypod.transkoi.com/ -name "*.html"
