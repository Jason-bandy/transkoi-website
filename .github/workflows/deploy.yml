name: Deploy luckypod.transkoi.com

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1

    - name: Copy index.html for root redirect
      run: cp public/index.html dist/index.html

    - name: Upload dist artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 1

  deploy-domestic:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download dist artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Deploy to domestic server (121.43.179.204)
      uses: easingthemes/ssh-deploy@v4
      with:
        SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.ALIYUN_HOST }}
        REMOTE_USER: root
        REMOTE_PORT: ${{ secrets.ALIYUN_PORT }}
        SOURCE: "dist/"
        TARGET: "/www/wwwroot/luckypod.transkoi.com"
        ARGS: "-avzr --delete --exclude='.user.ini'"
        SCRIPT_AFTER: |
          echo "=== Verify deployment ==="
          echo "Current user: $(whoami)"
          ls -la /www/wwwroot/luckypod.transkoi.com/
          find /www/wwwroot/luckypod.transkoi.com/ -name "*.html"
          echo "=== Done ==="

  deploy-overseas:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download dist artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Deploy to overseas server (8.208.83.225)
      uses: easingthemes/ssh-deploy@v4
      with:
        SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        REMOTE_HOST: 8.208.83.225
        REMOTE_USER: root
        REMOTE_PORT: 22
        SOURCE: "dist/"
        TARGET: "/www/wwwroot/luckypod.transkoi.com"
        ARGS: "-avzr --delete --exclude='.user.ini'"
        SCRIPT_AFTER: |
          echo "=== Verify deployment ==="
          echo "Current user: $(whoami)"
          ls -la /www/wwwroot/luckypod.transkoi.com/
          find /www/wwwroot/luckypod.transkoi.com/ -name "*.html"
          echo "=== Done ==="
